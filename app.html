<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villupuram Velu Drop Taxi App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background:#121212; color:#fff; padding:15px; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .app-container { background:#1e1e1e; border:2px solid #ffcc00; border-radius:16px; padding:25px; width:100%; max-width:420px; box-shadow:0 10px 30px rgba(255,204,0,0.2); }
        .app-header { text-align:center; margin-bottom:20px; }
        .app-header h2 { color:#ffcc00; font-size:22px; font-weight:700; margin-bottom:5px; }
        .app-header p { font-size:13px; color:#aaa; }
        .form-group { margin-bottom:15px; text-align:left; }
        .form-group label { display:block; font-size:12px; color:#ffcc00; margin-bottom:5px; font-weight:bold; }
        .input-box { width:100%; padding:12px 15px; border-radius:8px; border:1px solid #333; background:#2a2a2a; color:#fff; font-size:14px; outline:none; transition:0.3s; }
        .input-box:focus { border-color:#ffcc00; }
        select.input-box { cursor:pointer; }
        .btn-submit { width:100%; padding:15px; background:#ffcc00; color:#000; font-weight:bold; border:none; border-radius:8px; font-size:16px; cursor:pointer; margin-top:10px; transition:0.3s; box-shadow:0 4px 15px rgba(255,204,0,0.4); }
        .btn-submit:hover { background:#e6b800; transform:scale(1.01); }
        .call-btn { display:block; text-align:center; margin-top:20px; color:#25d366; text-decoration:none; font-weight:bold; font-size:15px; border:1px solid #25d366; padding:10px; border-radius:8px; background:rgba(37,211,102,0.1); }
        .call-btn i { margin-right:8px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <h2><i class="fa-solid fa-taxi"></i> Velu Drop Taxi</h2>
            <p>Villupuram Local & Outstation Cab Booking</p>
        </div>

        <form id="bookingForm">
            <div class="form-group">
                <label><i class="fa-solid fa-location-dot"></i> PICKUP LOCATION</label>
                <input type="text" id="pickup" class="input-box" placeholder="e.g. Mundiyampakkam, Villupuram" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-location-arrow"></i> DROP LOCATION</label>
                <input type="text" id="drop" class="input-box" placeholder="e.g. Chennai Airport, Puducherry" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> YOUR NAME</label>
                <input type="text" id="name" class="input-box" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> MOBILE NUMBER</label>
                <input type="tel" id="phone" class="input-box" placeholder="Enter your mobile number" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-car"></i> SELECT VEHICLE TYPE</label>
                <select id="vehicle" class="input-box">
                    <option value="Sedan (Swift Dzire) - ₹14/km">Sedan (Swift Dzire - 4 Seats) - ₹14/km</option>
                    <option value="SUV (Ertiga) - ₹19/km">SUV (Ertiga - 6 Seats) - ₹19/km</option>
                    <option value="Innova - ₹22/km">Innova - ₹22/km</option>
                </select>
            </div>

            <button type="submit" class="btn-submit"><i class="fa-solid fa-bolt"></i> BOOK RIDE NOW</button>
        </form>

        <a href="tel:9384427972" class="call-btn"><i class="fa-solid fa-phone"></i> Call Driver Directly: 9384427972</a>
    </div>

    <script>
        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB73ZKiPA4J_p3MVqEVfciQSZJXwHBzN7I",
            authDomain: "velu-drop-taxi.firebaseapp.com",
            databaseURL: "https://velu-drop-taxi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "velu-drop-taxi",
            storageBucket: "velu-drop-taxi.firebasestorage.app",
            messagingSenderId: "415671033174",
            appId: "1:415671033174:web:691d2e1903593308a30af7",
            measurementId: "G-X87MMR3Z45"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Handle Form Submit
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let pickup = document.getElementById('pickup').value;
            let drop = document.getElementById('drop').value;
            let name = document.getElementById('name').value;
            let phone = document.getElementById('phone').value;
            let vehicle = document.getElementById('vehicle').value;

            // Save Data to Firebase Realtime Database
            let rideRef = database.ref('rides').push();
            rideRef.set({
                name: name,
                phone: phone,
                pickup: pickup,
                drop: drop,
                vehicle: vehicle,
                timestamp: new Date().toISOString()
            });

            // Redirect to WhatsApp with Ride Details
            let message = `*NEW APP RIDE BOOKING*%0A%0A` +
                          `*Customer Name:* ${name}%0A` +
                          `*Phone:* ${phone}%0A` +
                          `*Pickup:* ${pickup}%0A` +
                          `*Drop:* ${drop}%0A` +
                          `*Vehicle:* ${vehicle}%0A%0A` +
                          `_Sent via Velu Drop Taxi App_`;

            window.open(`https://wa.me/919384427972?text=${message}`, '_blank');
        });
    </script>
</body>
</html>
